version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ainetui-backend
    ports:
      - "8000:8000"
    environment:
      - CAPTURE_INTERFACE=eth0
      - MOCK_MODE=true
      - WINDOW_SIZE=10
      - ANOMALY_THRESHOLD=5.0
      - OLLAMA_URL=http://ollama:11434
      - AI_MODEL=llama2
      - AI_TIMEOUT=30
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      - ollama
    networks:
      - ainetui-network
    restart: unless-stopped

  # Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ainetui-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ainetui-network
    restart: unless-stopped

  # Optional: Frontend service (to be implemented)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: ainetui-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_WS_URL=ws://localhost:8000
  #   depends_on:
  #     - backend
  #   networks:
  #     - ainetui-network
  #   restart: unless-stopped

volumes:
  ollama-data:

networks:
  ainetui-network:
    driver: bridge
