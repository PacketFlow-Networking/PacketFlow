version: '3.8'

services:
  # AINetUI App (Frontend + Backend in one container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainetui-app
    ports:
      - "80:80"        # Frontend (Nginx)
      - "5173:80"      # Alternative frontend port for dev compatibility
      - "8000:8000"    # Backend API
    environment:
      # Capture settings - MOCK MODE ONLY
      - CAPTURE_INTERFACE=eth0
      - MOCK_MODE=true
      - PCAP_FILE=
      - BUFFER_SIZE=1000
      
      # Condenser settings
      - WINDOW_SIZE=5
      - ANOMALY_THRESHOLD=2.5
      - MIN_FLOWS_FOR_ALERT=10
      - HISTORY_WINDOWS=12
      
      # AI settings - Local Ollama
      - AI_MODE=local
      - OLLAMA_URL=http://ollama:11434
      - LOCAL_AI_MODEL=mistral:7b
      - AI_TIMEOUT=30
      - AI_TEMPERATURE=0.7
      - AI_MAX_TOKENS=250
      
      # Server settings
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      
      # WebSocket settings
      - ENABLE_WEBSOCKET=true
      - WS_PING_INTERVAL=20
      - MAX_EVENTS_IN_MEMORY=1000
    volumes:
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ainetui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "&&", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ainetui-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ainetui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama-data:
    driver: local

networks:
  ainetui-network:
    driver: bridge
